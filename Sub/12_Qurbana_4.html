h1:PRAYERS BEFORE RECEIVING HOLY COMMUNION

AE:Make us worthy O Lord, / to receive Thee with holiness, / that by the food of Thy holy Body, / our lust may be lulled, / and by the drink of Thy living chalice / our passions may be quenched, / and by Thee, / we may become worthy / of the absolution of debts, / and the remission of sins, / our Lord and our God, / for ever. Amen.​
AE:
AE: Or
AE:
AE:O Lord, / thy exalted and holy mouth has promised and said / Whoso eats my Body / and drinks my Blood / and believes in me, / shall abide in me, / and I in him, / and I will raise him up / on the last day O Lord, / I have eaten Thy holy Body / and drunk thy propitiating Blood. / May they not become to us / for judgement or vengeance / or condemnation or indictment; / but for remission of debts, / and the forgiveness of sins, / and for the blessed resurrection / from the place of the dead, / and for a joyful face / before Thy awe-inspring throne, / my Lord and my God, / for ever. Amen.
