h1:Prayers when entering
h3:When entering the church
E:† I will enter your house in reverence / and offer my vows to you.
M:† Bahumathi poorvam / ninte bhavana-thilekku njaan vannu / ente nerchakal / njaan ninakku kazhikkum

h3:Shushroosha kuppayam dharikkumpol
E:O Lord God / clothe with an incorruptible surplice / by the power of the Holy Spirit | O Father, son and Holy spirit / grant us that / by pure and upright lives / we be guided in true faith / all the days of our lives / now and always, for ever - Amen.
M:Daivam aaya karthave / vishudha roohayude shakthiyaal / naasham illatha anki enne dhari-ppikkename. / Pithavum puthranum / vishudha roohayume / njangalude aayushkaalam muzhuvanum / sathya vishwaasathil / vedippum chovvum ulla nadapadikalil nadathha_ppeduvan / njangalkku sangathi aakkename / amen

h3:While entering the chancel, the deacon shall say
E:I come into the sanctuary of God / even to the God / who gives joy to my childness
M:Daivathinte balipeeda-thinkalekkum / ente paithal prakruthathe santhoshi-ppikkunna / daivathinte adukkalekkum njaan pokum.

h3:The deacon shall proceed to the altar and bow before it, saying
E:I have entered your house O God / and before your throne I have worshipped, O heavenly King | Forgive me all the sins that I have committed against you.
M:Daivame! ninte bhavana-thilekku njaan praveshichu. / Swargasthan aaya rajave / ninte simhaasanathin munpake njan vanangi / njaan cheythittulla sakala papangalum / ennodu kshemi-kkename

h3:Going round the altar and kissing its corners he says
E:O Lord / bind our assemblies with chains / even to the corners of your sanctuary | You are my God / I will give thanks to you | You are my God, I will glorify you.
M:Karthave / ninte balipeeda-thinte konukal vare / changala_kalaal / njangalude perunnaalukale bandhikkename. / Nee ente daivam aakunnu. / Ninakku njaan sthothram cheyyum. / Nee ente daivam aakunnu. / Ninne njaan sthuthikkum

h1:Beginning Prayer 
E:† In the name of the Father, and of the Son, and of the Holy Spirit, one true God;
M:† Pithaavum, puthranum, parishudha roohaayum aaya / sathya eka daivathinte thirunaamathil thanikku sthuthi.

E:Glory be to Him, and may His grace and mercy be upon us forever. Amen.
M:Aadhi muthal ennekkum thanne. Amen

E:Holy, Holy, Holy, Lord God Almighty, by whose glory, the heaven and earth are filled, Hosanna in the Highest.
M:Aakashavum bhoomiyum / thante sthuthikalaal niranju irikkunna balavaan aaya daivam thampuran / parishudhan parishudhan parishudhan. Uyarangalil sthuthi.

E:Blessed is He, who has come, and is to come, in the name of the Lord God, Glory be to Him in the Highest.
M:Daivam aaya karthavinte thirunamathil / vannavanum varuvaan irikkunnavanum aayavan vazhtha-ppettavan aakunnu. / Uyarangalil sthuthi

h2:Kauma    
E:Holy art thou, O God!
M:Daivame! nee parishudhan aakunnu

E:Holy art thou, Almighty,
M:Balavaane! nee parishudhhan aakunnu

E:Holy art thou, Immortal,
M:Maranam illathavane! nee parishudhan aakunnu

E:† Crucified for us, Have mercy on us.
M:Njangalkku vendi † kurishikka_ppettavane! njangalodu karuna cheyyename

E:Lord, have mercy upon us,
M:Njangalude karthaave! njangalodu karuna cheyyename.

E:Lord be kind, and have mercy,
M:Njangalude karthaave! krupa undaayi njangalodu karuna cheyyename.

E:Lord accept Thou our offices and our entreaties. Have mercy upon us.
M:Njangalude karthaave! njangalude shushrooshakalum prarthana-kalum kaikondu / njangalodu karuna cheyyename.

E:Glory be to Thee, O God!
M:Daivame! ninakku sthuthi.

E:Glory be to Thee, O Creator, ​
M:Srushtaave! ninakku sthuthi.

E:Glory be to The Messiah, King who has compassion on us thy sinful servants, Barekmor.
M:Papikal aaya ninte adiyaarodu karuna cheyyunna / mashiha rajave! ninakku sthuthi, Barekmor

E:Our Father who art in heaven, - hallowed be thy name, - Thy kingdom come, - Thy will be done on earth, - as it is in heaven. - Give us this day our daily bread, - and forgive us our debts and sins, - as we also have forgiven our debtors. - Lead us not into temptation, - but deliver us from the evil one. - For Thine is the kingdom, the power and the glory, - forever and ever, Amen.​
M:Swargasthan aaya njangalude pithave! / ninte thirunaamam parishudham aakkappedename. / Ninte raajyam varename. / Ninte thiruvishtam swargathile pole bhoomiyilum aakename. / Njangalkku aavashyam ulla appam innu njangalkku tharename. / Njangalude kadakkarodu njangal kshemichathu pole / njangalude kadangalum, papangalum njangalodu kshemikkename. / Pareeksha-yilekku njangale praveshi-ppikkaruthe. / Pinnayo dushtanil ninnu njangale rakshichu kollename. / Enthukondennaal rajyavum, shakthiyum, mahathwavum / ennekkum ninakku ullathu aakunnu. Amen.

E:Peace to thee Mary, full of grace, - our Lord is with thee. Blessed are thou among women, - and blessed is the fruit of thy womb, - our Lord Jesus Christ. O, Virgin Saint Mary, - O Mother of God, - pray for us sinners, - now at all times, - and at the hour of our death, Amen.​
M:Krupa niranja Mariyame! ninakku samadhanam. / Nammude karthaavu ninnodu koode. / Sthreekalil nee vaazhtha-ppettaval aakunnu. / Ninte udhara phalam aaya nammude karthavu yeshu mashiha / vazhtha_ppettavan aakunnu. / Daiva mathavu aaya vishudha kanyaka martha mariyame! / Thampurante amme, / papikal aaya njangalkku vendi / ippozhum eppozhum njangalude marana samayathum / daivam thampuraanodu apekshichu kollename. Amen
