AA:
AE:Priest: O Lord Jesus Christ, who became incarnate of the holy virgin; lived as man in this world; and united Your Father and us mortals by Your sacrifice on the Cross, accept the office we offer you in remembrance of Your holy mother, the holy prophets, martyrs and all Your saints. By their prayers, may we get spared from wrathful punishments, from evil spirits, and evil men; and live a life holy and well pleasing to You. We offer you praise and adoration now and forever more. Amen

h1:Psalms 51
AE:Have mercy on me O God, according to your unfailing love, according to your great compassion, blot out my transgressions.
AM:Daivame ninte krupayin prakaaram ennodu karuna cheyaname./ Ninte karunayude behuthwathin prakaram / ente papangal mayichu kalayename.
AA:
AE:Wash away all my iniquity, and cleanse me from my sin. For I acknowledge my transgression, and my sin is always before me.​
AM:Ente annyayathil ninnu enne nannayi kazhuki, / ente papangalil ninnum enne vedippakkename; / Enthennaal ente athikramangal ellam njan ariyunnu, / ente papangal eppozhum ente nereyum irikkunnu.
AA:
AE:Against you, you only have I sinned, and done what is evil in your sight, so that you are proved right when you speak, and justified when you judge. Surely I was sinful at birth, sinful from the time my mother conceived me.​
AM:Ninnodu thanne njaan papam chaithu,/ ninte thirumunpil thinmakal njaan chaithu./ Ennaal ninte vachanathil nee neethikarikka pedukayum, / ninte nyayavidhikalil nee jayikkukayam cheyvaanum aayittu thanne. / Enthennal anyayathil njan ulbhavichu;/ Papangalil ente mathavu enne garbham dharikkukayum cheythu.
AA:
AE:Surely you desire truth in the inner parts; you teach me wisdom in the inmost place. Cleanse me with hyssop, and I will be clean, wash me, and I will be whiter than snow.
AM:Ennaal neethiyil nee ishtapettu,/ ninte Njaanathinte rehasyangal enne nee ariyichu, / ninte soppa kondu ente mel thalikkename,/ njaan vedippakkapedum, athinaale enne venmayakkename; / uracha manjinekkaal njaan venmayakum.
AA:
AE:Let me hear joy and gladness; let the bones you have crushed rejoice. Hide your face from my sins, and blot out, all my iniquity.
AM:Ninte aanandavum santhoshavum kondu enne thrupthi aakkenanme,/ ksheenam ulla ente asthikal santhoshikkum./ Ente papangalil ninnu ninte thiru mukham thirichu / ente athikramangal okkeyum mayikkaname.
AA:
AE:Create in me a pure heart O God, and renew a steadfast spirit within me. Do not cast me away from thy presence, or take away your Holy Spirit from me.​
AM:Daivame! vedippulla hrudayam ennil srushtikkename!/ Sthiratha ulla ninte roohaye ente ullil puthuthakkename. / Ninte thiru munpil ninnu enne thalli kalayaruthe; / Ninte visudha aathmavine ennil ninnu edukkayum aruthe.​
AA:
AE:Restore to me the joy of your salvation, and uphold me by your generous spirit. Then I will teach transgressors your ways, and sinners will turn back to you.
AM:Ennaalo ninte aanandavum rekshayum enikku thirichu tharename./ Mahathwam ulla ninte aathmavu enne thangumar aakename. / Appol njan athikramakkaare ninte vazhi patippikum, / paapikal ninkalekku thiriyukayum cheyum.
AA:
AE:Save me from bloodguilt, O God, the God who saves me, and my tongue will sing your righteousness. O Lord, open my lips, and my mouth will declare your praise.
AM:Ente rekshayude Daivam aaya Daivame! Rekthathil ninnu enne rekshikkename! Ente naavu ninte neethiye sthuthikkum. Karthaave! ente adharangal eniku thurakkename. / Ente vai ninte sthuthikal paadum.
AA:
AE:You do not delight in sacrifices, or I would bring it, and you do not take pleasure in burnt offerings. The sacrifices of God are a broken spirit, a broken and contrite heart, O God, you will not despise.
AM:Enthennal balikalil nee thirumanassu aayilla./ Homa balikalil nee nirappu aayathum illa./ Daivathinte balikal thazhma  ulla athmavu aakunnu, / Daivam nurungiya hrudayam nirasikunnilla.
AA:
AE:In your good pleasure, make Zion prosper, build up the walls of Jerusalem. Then there will be righteous sacrifices, whole burnt offerings to delight you, then bulls will be offered on your altar.​
AM:Ninte ishtathhaal sehiyonodu nanma cheyyename./ Oorshleminte mathilukal paniyename./ Appol neethi balikalilum, homa balikalilum nee ishtapedum./ Appol ninte belipeetathin mel kaalakal bali aayi karerum.
AA:
AE:And to you belongs the praise, O God. Barekmor. †Shubaho...  Men olam... ​
AM:Daivame sthuthi ninakku yogyam aakunnu. Barekmor​. †Shubaho...  Men olam... ​

h1:Psalms 63
AE:Barekmor. My God! You are my God, / earnestly I will seek you.
AM:Barekmor. Ente dhaivame nee ente dhaivam aakunnu; njaan ninakku aayi kaathu irikkum.
AA:
AE:My soul thirsts for you, / and my body longs for you, / as the dry and weary land cry for water.
AM:Dhaahichu varandu vellathinnai aagrahikunna bhoomi pole ente aathmavu ninne kurichu dhahichu irikkunnu. Ente jadavum ninakkai kathu irikkunnu.
AA:
AE:I looked at you in the Sanctuary, / to behold your power and glory.
AM:Ninte balavum ninte bahumaanavum kaanman iprakaram sathyam aayittu njaan ninne nokki.
AA:
AE:My lips will glorify you, / because your loving kindness is better than life.
AM:Enthennaal ninte karuna jeevanekkaal nallathu aakunnu. Ente adharangal nine sthuthikkum.
AA:
AE:I will praise you as long as I live, / and I will lift up my hands like this, / in your name.
AM:Njaan jeevanode irikkumpol iprakaram njaan ninne vazthukayum ninte naamathil ente kaikal uyarthukayum cheyyum.
AA:
AE:My soul will be flourished as with marrow and fat, / and my mouth shall praise you with singing lips.
AM:Ente aathmavu kozhuppum medhassum kondenna pole pushhtiyakum. Ente vaay sthuthi ulla adharangal kondu ninne mahathwapeduthukayum cheyyum
AA:
AE:I remember you upon my bed, / I think of you through the watches night.
AM:Ente kidakka mel njaan ninne orthu; rathri kalangalil njaan ninne dhyanikkukayum cheythu.​
AA:
AE:Because you are my help, / I sing in the shadow of your wings.
AM:Enthennaal nee eniku sahayakanai theernnu. Ninte chirakukalude nizhalil njaan maraykkapedum.
AA:
AE:My soul clings to you, / your right hand upholds me.
AM:Ente aathmavu ninne pinthudarnnu, ninte valathu kai enne thaangukayum cheythu
AA:
AE:They who seek my life will be destroyed; / they will go down to the depths of the earth.
AM:Ente aathmavine nashippippaan anweshikunnavar bhoomiyude aazhangalilekku praveshikkum.
AA:
AE:They will be given over to the sword, / and become food for foxes.
AM:Avar valinu elpikka pedukayum, kuru narikalku bhakshanam aayi theerukayum cheyyum. Raajaavu dhaivathil santhoshikkum.
AA:
AE:But the king will rejoice in God. / All who swear by God’s name will praise Him, / while the mouths of the liars will be silenced.
AM:Avane kondu aana idunna evanum pukazcha undaakum. Enthennaal asathyam parayunnavarude vaay adaykkapedum.

h3:KA:Psalms - 19
KE:Barekmor. The heavens declare the glory of God; / the skies proclaim the work of His hands.
KM:1-2 Aakaashangal dhaivathinte mahathwathe ariyikkunnu. / Aakaashathattu avante kaivelaye kaanikkunnu. / Pakal pakalinu vakkine ucharikunnu; / raathri raathrikku arivine ariyikkukayum cheyyunnu.
KA:
KE:Day after day they pour forth speech; / night after night they display knowledge.
KE:
KE:There is no speech or language / where their voice is not heard.
KE:
KE:Their voice goes out into all the earth, / their words to the ends of the world.
KM:3-4 Avayude shabdham kelkkapedatha bhashayum illa vaakkukalum illa. / Bboomiyil ellaa idavum avayude ariyippum, / bhoolokathinte athirthikalolam avayude vachanangalum purapettu irikkunnu.
KA:
KE:In the heavens he has pitched a tent for the sun, / which is like a bridegroom coming forth from his pavilion, / like a champion rejoicing to run his course.
KM:5 Avan avayil sooryante mel avante koodaaram adichu; / athu thante manavarayil ninnu purappedunna manavaalan enna pole akunnu. / Paraakramam ullavan enna pole tbante vazhi oduvan santhoshikkum.
KA:
KE:It rises at one end of the heavens / and makes its circuit to the other; / nothing is hidden from its heat.
KM:6. Aakaashathinte attangalil ninnu athinte purappaadum, / aakaashathinte aruthikalinmel athinte thaangalum aakunu. / Athinte aaviyil ninnu maravu aayirikkunnathu onnum illa.
KA:
KE:The law of the Lord is perfect, reviving the soul. / The statutes of the Lord are trustworthy, / making wise the simple.
KE:
KE:The precepts of the Lord are right, / giving joy to the heart. / The commands of the Lord are radiant, / giving light to the eyes.
KM:7-8 Karthaavinte vedhapramaanam kara illaathathum / aathmaavine thirikkunnathum aakunnu. / Karthaavinte saakshi vishwaasa yogyavum shishukkale njaanam ullavar aakkunnathum aakunnu. / Karthaavinte pramaanangal chovvullavayum, / hrudhayathe santhoshippikkunnavayum aakunnu. / Karthaavinte kalpana thiranju edukkappettathum, / kannukale prakaashi-ppikkunnathum aakunnu.

KE:

KM:9-10 Karthaavine kurichu ulla bhayam vedippu ullathum ennekkum nilanilkkunnathum aakunnu. / Karthaavinte nyaya vidhikal / sathyam aayittu ullavayum, sakalathilum neethi aayittu ullavayum aakunnu. / Ava swarnathekkaalum nalla rathnangalekkaalum aagrahikka thakkavayum / theninekkaalum then kattayekkaalum maadhuryam ullavayum aakunnu.

KE:
