h3:KM:Aprem's Bovooso
KM:Njangalkk ulla karthaave!, - Njaan iha nidhra ozhinjittu,
KM:Unarvode nin thiru munpil, - Nilpaan enikku nee nalkaname.
KM:
KM:Veendum njaan urangunnaakil, - Enikk ulla ente urakkam,
KM:Karthaave! nin thiru munpil, - Dosham koodaathe aakkaname.
KM:
KM:Enn unarchhayil njaan chathi pedukil, - Nin nanmayil njaan porukkappedum,
KM:Urakkathil njaan pizhachhenkil, - Poruppaan karuna nee cheyyaname.
KM:
KM:Thava ksheenathin skeeppaayaal, - Nalla urakkam enikku nee thaa,
KM:Aakaa swapnam ashudhhiyil ninn - Enne nee rekshichhu kollaname.
KM:
KM:Nirappu niranja urakkathil, - Raav okkayum enne nee bharikka,
KM:Thannyavarum vendaa ninavum, - Ennil mushkaram aakkalle.
KM:
KM:Ninte adiyaan njaan athinaal - Ente sandhukkal kaappaan aay,
KM:Velivinude Maalaakaaye, - Enikku nee tharanam Karthaave.
KM:
KM:Dveshatha petta apekshayil ninn - Enne nee rekshichhu kollaname,
KM:Uyirpetta nin dehathe, - Njaan anubhavichh ennu athinaale.
KM:
KM:Njaan charinj anukoolathaal urangumbol, - Ninte chora enikku kaaval,
KM:Nin manassinude swatha karmam, - Nin krupayode nalkaname.
KM:
KM:Nin kay mananja shareerathil, - Ninte valathheth aakaname,
KM:Ninte karunakal kotta athaay - Enikku nee chuttichhu kollaname.
KM:
KM:Shareeram adangi urangumbol, - Kaaval athaay athu nin shakti,
KM:Sourabhyam aaya dhoopam pol - Ente urakkam thiru munpil.
KM:
KM:Ninne pett enna ammayude, - Ninnod ulla apekshayaale,
KM:Enikk ulla shayanathinmel, - Thinmappettavan anayaruthe.
KM:
KM:Enikku vendeett undaay enna - Ninakk ulla poojayaale,
KM:Enne vyasanathil aakkaayvaan, - Saathaane nee mudakkaname.
KM:
KM:Karthaave njan paranj appo - Ente pakkal thikakkaname,
KM:Ninakk ulla sleebaayaal, - Ente aayussu kaakkaname.
KM:
KM:Njaan unarappettenn appol, - Ninne njaan kond aaduvaan,
KM:Ente thalarchhayude pakkal, - Ninte upavi nee kaattaname.
KM:
KM:Nin thiru manassine njaan arinju, - Njaan athine cheyvaan aaye,
KM:Nin thiru managunam athinaale, - Enikku nee manogunam cheyyaname.
KM:
KM:Nirappu niranj oru antheeyum, - Punnyathvathinude raavum
KM:Njangalude rakshaakaran mashiha, - Karthaave adiyaarkku nee tharika.
KM:
KM:Velivil thaan prakaashichhu, - Velivil thanne paarkkunnu,
KM:Velivinude suthar aayavarum, - Ninne thanne vannikkunnu.
KM:
KM:Ninakku sthuthi nin anugrahangal, - Njangalude melum athaakaname,
KM:Ihalokathilum athupole, - Paralokathilum athaakaname.
KM:
KM:Ente Karthaave! ninakku sthuthi, - Ninakku sthuthi sthuthi ninakku sthuthi,
KM:Aayirangalude aayiravum, - Alavu koodathe ninakku sthuthi.
KM:

KM:
KM:Swargaa dhootharkk udayavane, - Avaraal mahathwa pedunnavane,
KM:Vandanavodu ninakku sthuthi, - Praarthanakal kai kollaname.
KM:
KM:Thriyekam ekathriyaam, - Eka dhaivavum aayulla,
KM:Pithrusutha parishudhh aathmaavaam, - Sathya parane ninakku sthuthi.
KM:
KM:Balaheenarude apekshakalum, - Anuthaapikalude kannuneerum,

KM:Poozhikal aayavaril ninnu, - Alav illaathe ninakku sthuthi.
KM:

KM:

h1:Psalms 91
AE:Barekmor: You that sit in the shelter of the Most High and abide in glory; in the shadow of God.
AM:Barekmor - Uyarappettavante Maravil irrikkunnavanum, / Daivathinte nizhalil mahathwa pedunnavanume!
AA:
AE:Barekmor: Say to the Lord; "My trust and my refuge; the God in whom I confide‟.
AM:Barekmor - Njaan aashrayichu irikkunna daivam / ente sharanavum ente sanketha sthalavum ennu / karthhaavine kurichu nee parayuka.
AA:
AE:For He shall deliver you from the snare of stumbling, and from idle talk.
AM:Enthennaal avan virudhhathhinte keniyil ninnum / vyartha samsaarathhil ninnum ninne veendukollum.
AA:
AE:He shall keep you under His feathers, and by His wings, you shall be covered; and His truth shall encompass you like an armor.
AM:Avan avante thoovalukal kondu ninne rekshikkum. / Avante chirakukalude keezhil nee maraykka pedum. / Avante sathyam ninte chuttum aayudham aayirikum.
AA:
AE:You shall not fear from the terror by night, and from the arrow that flies by the day. And from the Voice that travels in the darkness, and from the devastating wind in the noon.
AM:Nee raathriyile bhayathhil ninnum, / pakal parakkunna asthrathil ninnum / iruttil sancharikkunna vachanathhil ninnum / uchhayil oothunna kaattil ninnum bhayappeduka illa.
AA:
AE:Thousands shall fall at your side and ten thousands at your right side.
AM:Ninte oru bhaagathu aayirangalum, / ninte valathhu bhagathhu pathinaayirangalum veezhum.
AA:
AE:They shall not come near to you but with your eyes you shall see only; You shall see the revenge of the wicked
AM:Ava ninkalekku aduka illa. / Ennalo ninte kannukal kondu nee kaanuka maathram cheyyum. / Dushtanmaarkkku ulla prathiphalathe nee kaanum.
AA:
AE:Since You have said "Thou art the Lord, my trust. Who has placed thy abode in the heights‟.
AM:Enthennaal swantha vaasa sthalam / uyarangalil aakki irikunnu enna / ente sharanam aaya karthavu nee aakunnu.
AA:
AE:No evil shall come near to you; neither shall any plague draw near to your dwelling place.
AM:Dosham ninnodu adukka illa. / Shiksha ninte vasa sthalathhinu sameepikkayum illa.
AA:
AE:For He shall give His angels command concerning you, who shall protect you in all your ways.
AM:Enthennaal ninte sakala vazhikalilum / ninne kaakkendathinu / avan ninne kurichu avante malakhamaarodu kalpikum.
AA:
AE:And they shall bear you up in their hands, lest your foot stumble.
AM:Ninte kaalil ninaku idarcha bhavikathe irippan / avar thangalude bhujangalin mel ninne vahikum.
AA:
AE:You shall tread upon the adder and the basilisk; and you shall trample down the lion and the dragon.
AM:Sarpathheyum analiyeyum nee chavittum. / Simhathheyum perumpampineyum nee methikum.
AA:
AE:(For the Lord has said): "Since he has sought me, I will deliver him and strengthen him‟.
AM:Avan enne anweshichhathu kondu / njaan avane rekshichhu belappeduthhum; / ente naamam arinjathukondu avan enne vilikkum.
AA:
AE:Since he has known my name he shall call upon me and I will answer him, and be with him in affliction‟.
AM:Njaan avanodu utharam parayum. / Njerukathhil njaan avanodu koode irrunnu / avane belappeduthi behumaanikkum.
AA:
AE:I will strengthen him and honor him. With long life, will I satisfy him, and show him my salvation.
AM:Deerkha aayussu kondu / njaan avane thrupthipeduthhum. / Ente reksha avane njaan kanikkayum cheyyum.

h1:Psalm 121
AE:I will lift up eyes to the mountain, from whence comes my helper.
AM:Njaan parvathathhilekku / ente kannukale uyarthum. / Ente sahaayakkaaran evide ninnu varum.
AA:
AE:My help is from the Lord who has made the heaven and the earth.
AM:Ente sahaayam aakashavum bhoomiyum srushhticha / karthhaavinte sannidhiyil ninnu aakunnu.
AA:
AE:He will not suffer your foot to tremble; Your keeper shall not slumber.
AM:Avan ninte kaal elakuvan sammathikkuka illa / Ninte kaavalkkaran urakkam thoonguka illa
AA:
AE:For neither slumbers, nor sleeps the keeper of Israel; the Lord is your keeper.
AM:Enthennaal Israelinte kaavalkkaaran / urakkam thoongunnum illa; / urangunnum illa
AA:
AE:The Lord shall overshadow you with his right hand. The sun shall not smite you by day; nor the moon by night;

AE:Priest:- We believe In One True God,​

AE:And in the One Lord Jesus Christ, the Only begotten Son of God; begotten of the Father before all worlds; Light of Light; Very God of very God; begotten, not made; being of the same substance with the Father; and by whom all things were made:​† Who For Us Men, And For Our Salvation, Came Down From Heaven,​† And Was Incarnate Of The Holy Virgin Mary, Mother Of God, By The Holy Ghost, And Became Man:​† And Was Crucified For Us In The Days Of Pontius Pilate; And suffered, And Died, And Was Buried:​ And the third day rose again according to His will: and ascended into heaven, and sat on the right hand of the Father; and shall come again in His great glory to judge both the quick and the dead: whose kingdom shall have no end.​
