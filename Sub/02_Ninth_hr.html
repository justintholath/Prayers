h1:Kolo (Hymns)
AE:He who gives life by resurrection is worthy of praise.
AE:Blessed Paul says this to the person of wavering mind.
AE:"You fool! when you sow a seed, it dies and then sprouts to life."
AE:He let know that the whole generation of Adam will live in glory. Barekmor. † Subaho...  Men Olam
AM:Shree uthhaanathhin eki - sharanam jeevippin ettiyavan
AM:Sampoojyan; dhanyan paulose - othunn asthiranod evam
AM:"Bhosha! dhaanyam vitha cheythal
AM:Valara kedenye" mahima
AM:Vodadhamya kulam - jeevichidum ennariyichaan. Barekmor. † Subaho...  Men Olam
AA:

AE:The first born son who went to hell and won over death is worthy of worship.
AE:When Adam saw him, he bowed his head in relief
AE:and said "Oh! Lord, pardon my offences along with my children's
AE:and please join me to the paradise which I lost in the earlier days.". Moriyorahem...
AM:Paathale chenniha mruthiye - vennon aadhya thanujan sthuthyan
AM:Thanne kandaashwasathod - aadham thala thaazhthi kooppi
AM:Chonnaan naatha! pizha pokki
AM:sutharoppam munnam njaan pin
AM:vaangiya parudeesil - chertheedanam ingoonnenne. Moriyo rahem...

h1:Bovootho of Balai
AE:Oh! merciful Lord, in your resurrection, please renew your creation
AM:Karuna niranjavane! punaru-thhaanathhil
AM:Ninnude srushhtiye nee - puthuth aakkeetaname
AA:

AE:Please grant peace and remission to the departed, who die in you expecting your second coming
AM:Ninnil nidhra ata-nj aagamanam kaakkum
AM:Mrutharil Shanthi ana-ch ekkuka parihaaram
AA:

AE:Let the departed who take refuge in you, sit in the lap of Abraham, Isaac and Jacob
AM:Nin abhaye mruthare - Abraham isahakku
AM:Yacob ennivar than - madiyil paarppikka
AA:

AE:Let the body, and the soul praise him who has come and is to come and raises up the dead
AM:Vannavanam varuvon - mruthare ettunnon
AM:Sthuthan enn aartheedum-Meyyot aathmaavum.
