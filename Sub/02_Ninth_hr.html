h1:Kolo (Hymns)
E:He who gives life by resurrection is worthy of praise.
E:Blessed Paul says this to the person of wavering mind.
E:"You fool! when you sow a seed, it dies and then sprouts to life."
E:He let know that the whole generation of Adam will live in glory. Barekmor
E:† Subaho...  Men Olam

M:Shree uthhaanathhin eki - sharanam jeevippin ettiyavan
M:Sampoojyan; dhanyan paulose - othunn asthiranod evam
M:"Bhosha! dhaanyam vitha cheythal
M:Valara kedenye" mahima
M:Vodadhamya kulam - jeevichidum ennariyichaan. Barekmor
M:† Subaho...  Men Olam


E:The first born son who went to hell and won over death is worthy of worship.
E:When Adam saw him, he bowed his head in relief
E:and said "Oh! Lord, pardon my offences along with my children's
E:and please join me to the paradise which I lost in the earlier days."
E:Moriyorahem...

M:Paathale chenniha mruthiye - vennon aadhya thanujan sthuthyan
M:Thanne kandaashwasathod - aadham thala thaazhthi kooppi
M:Chonnaan naatha! pizha pokki
M:sutharoppam munnam njaan pin
M:vaangiya parudeesil - chertheedanam ingoonnenne
M:Moriyo rahem...

h1:Bovootho of Balai
E:Oh! merciful Lord, in your resurrection, please renew your creation
M:Karuna niranjavane! punaru-thhaanathhil
M:Ninnude srushhtiye nee - puthuth aakkeetaname

E:Please grant peace and remission to the departed, who die in you expecting your second coming
M:Ninnil nidhra ata-nj aagamanam kaakkum
M:Mrutharil Shanthi ana-ch ekkuka parihaaram

E:Let the departed who take refuge in you, sit in the lap of Abraham, Isaac and Jacob
M:Nin abhaye mruthare - Abraham isahakku
M:Yacob ennivar than - madiyil paarppikka

E:Let the body, and the soul praise him who has come and is to come and raises up the dead
M:Vannavanam varuvon - mruthare ettunnon
M:Sthuthan enn aartheedum-Meyyot aathmaavum.
