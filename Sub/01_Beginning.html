h1:Prayers when entering
h3:When entering the church
AE:† I will enter your house in reverence / and offer my vows to you.
AM:† Bahumathi poorvam / ninte bhavana-thilekku njaan vannu / ente nerchakal / njaan ninakku kazhikkum

h3:Shushroosha kuppayam dharikkumpol
AE:O Lord God / clothe with an incorruptible surplice / by the power of the Holy Spirit | O Father, son and Holy spirit / grant us that / by pure and upright lives / we be guided in true faith / all the days of our lives / now and always, for ever - Amen.
AM:Daivam aaya karthave / vishudha roohayude shakthiyaal / naasham illatha anki enne dhari-ppikkename. / Pithavum puthranum / vishudha roohayume / njangalude aayushkaalam muzhuvanum / sathya vishwaasathil / vedippum chovvum ulla nadapadikalil nadathha_ppeduvan / njangalkku sangathi aakkename / amen

h3:While entering the chancel, the deacon shall say
AE:I come into the sanctuary of God / even to the God / who gives joy to my childness
AM:Daivathinte balipeeda-thinkalekkum / ente paithal prakruthathe santhoshi-ppikkunna / daivathinte adukkalekkum njaan pokum.

h3:The deacon shall proceed to the altar and bow before it, saying
AE:I have entered your house O God / and before your throne I have worshipped, O heavenly King | Forgive me all the sins that I have committed against you.
AM:Daivame! ninte bhavana-thilekku njaan praveshichu. / Swargasthan aaya rajave / ninte simhaasanathin munpake njan vanangi / njaan cheythittulla sakala papangalum / ennodu kshemi-kkename

h3:Going round the altar and kissing its corners he says
AE:O Lord / bind our assemblies with chains / even to the corners of your sanctuary | You are my God / I will give thanks to you | You are my God, I will glorify you.
AM:Karthave / ninte balipeeda-thinte konukal vare / changala_kalaal / njangalude perunnaalukale bandhikkename. / Nee ente daivam aakunnu. / Ninakku njaan sthothram cheyyum. / Nee ente daivam aakunnu. / Ninne njaan sthuthikkum

h1:Beginning Prayer 
AE:† In the name of the Father, and of the Son, and of the Holy Spirit, one true God;
AM:† Pithaavum, puthranum, parishudha roohaayum aaya / sathya eka daivathinte thirunaamathil thanikku sthuthi.
AA:

AE:Glory be to Him, and may His grace and mercy be upon us forever. Amen.
AM:Aadhi muthal ennekkum thanne. Amen
AA:

AE:Holy, Holy, Holy, Lord God Almighty, by whose glory, the heaven and earth are filled, Hosanna in the Highest.
AM:Aakashavum bhoomiyum / thante sthuthikalaal niranju irikkunna balavaan aaya daivam thampuran / parishudhan parishudhan parishudhan. Uyarangalil sthuthi.
AA:

AE:Blessed is He, who has come, and is to come, in the name of the Lord God, Glory be to Him in the Highest.
AM:Daivam aaya karthavinte thirunamathil / vannavanum varuvaan irikkunnavanum aayavan vazhtha-ppettavan aakunnu. / Uyarangalil sthuthi
AA:

h1:Kauma
h2:Trisagion
AE:Holy art thou, O God!
AM:Daivame! nee parishudhan aakunnu
AE:Holy art thou, Almighty,
AM:Balavaane! nee parishudhhan aakunnu
AE:Holy art thou, Immortal,
AM:Maranam illathavane! nee parishudhan aakunnu
AE:† Crucified for us, Have mercy on us.
AM:Njangalkku vendi † kurishikka_ppettavane! njangalodu karuna cheyyename
AA:

AE:Lord, have mercy upon us,
AM:Njangalude karthaave! njangalodu karuna cheyyename.
AE:Lord be kind, and have mercy,
AM:Njangalude karthaave! krupa undaayi njangalodu karuna cheyyename.
AE:Lord accept Thou our offices and our entreaties. Have mercy upon us.
AM:Njangalude karthaave! njangalude shushrooshakalum prarthana-kalum kaikondu / njangalodu karuna cheyyename.
AA:

AE:Glory be to Thee, O God!
AM:Daivame! ninakku sthuthi.
AE:Glory be to Thee, O Creator, ​
AM:Srushtaave! ninakku sthuthi.
AE:Glory be to The Messiah, King who has compassion on us thy sinful servants, Barekmor.
AM:Papikal aaya ninte adiyaarodu karuna cheyyunna / mashiha rajave! ninakku sthuthi, Barekmor

h2:Lord's Prayer
AE:Our Father who art in heaven, - hallowed be thy name, - Thy kingdom come, - Thy will be done on earth, - as it is in heaven. - Give us this day our daily bread, - and forgive us our debts and sins, - as we also have forgiven our debtors. - Lead us not into temptation, - but deliver us from the evil one. - For Thine is the kingdom, the power and the glory, - forever and ever, Amen.​
AM:Swargasthan aaya njangalude pithave! / ninte thirunaamam parishudham aakkappedename. / Ninte raajyam varename. / Ninte thiruvishtam swargathile pole bhoomiyilum aakename. / Njangalkku aavashyam ulla appam innu njangalkku tharename. / Njangalude kadakkarodu njangal kshemichathu pole / njangalude kadangalum, papangalum njangalodu kshemikkename. / Pareeksha-yilekku njangale praveshi-ppikkaruthe. / Pinnayo dushtanil ninnu njangale rakshichu kollename. / Enthukondennaal rajyavum, shakthiyum, mahathwavum / ennekkum ninakku ullathu aakunnu. Amen.
AA:

AE:Peace to thee Mary, full of grace, - our Lord is with thee. Blessed are thou among women, - and blessed is the fruit of thy womb, - our Lord Jesus Christ. O, Virgin Saint Mary, - O Mother of God, - pray for us sinners, - now at all times, - and at the hour of our death, Amen.​
AM:Krupa niranja Mariyame! ninakku samadhanam. / Nammude karthaavu ninnodu koode. / Sthreekalil nee vaazhtha-ppettaval aakunnu. / Ninte udhara phalam aaya nammude karthavu yeshu mashiha / vazhtha_ppettavan aakunnu. / Daiva mathavu aaya vishudha kanyaka martha mariyame! / Thampurante amme, / papikal aaya njangalkku vendi / ippozhum eppozhum njangalude marana samayathum / daivam thampuraanodu apekshichu kollename. Amen
