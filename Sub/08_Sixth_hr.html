h3:Kauma

SE:Peace to thee Mary ​
SE:Ark of mysteries ​
SE:That Moses did make ​
SE:Thy symbol as veil divine ​
SE:That contained water of life ​
SE:Peace to thee that strong city ​
SE:Magnified by King David ​
SE:Jesse's son; God come forth from thee! Barekmor​. † Shubaho
SM:Mosha chamach ora - pedaka drushtaantham ​
SM:Mariyaame shlommo - jeeva jalathhin munkuriyaam ​
SM:Roohaa than shoshappaa shlom ​
SM:Aishaayan dhaaveedh uktham - sthiramaam purame shlommo - ​
SM:nin udharattheenn udhayam cheyth eeshan... Barekmor​. † Shubaho
SA:

SE:Martyrs did carry ​
SE:Armour of the Cross ​
SE:And fought evil one ​
SE:Some of them were cut by sword ​
SE:Some were burnt in cruel flames ​
SE:Enemy got all angry for ​
SE:They never turned back in warfare ​
SE:By their prayers - absolve us, O Lord! Men Olam...

SE:Lord, our departed ​
SE:who did partake of ​
SE:Thy Body and Blood ​
SE:In Thy love make them enjoy ​
SE:Table laid for righteous ones ​
SE:Upholding Thee in their lives ​
SE:They died with all hope in Thee ​
SE:Uphold them before Thy Father. Moriyo rahem...
SM:Naadhaa nin meyyum - rakthavum ettoraam ​
SM:Mruthare sidharkk aay - pante sajjeekrutham aakum ​
SM:Panthikkan pod - iruthaname ​
SM:Nin sharane maranam poontor​
SM:Ninne ettoraam avare ​
SM:Elkkaname thaathankal neeyum. Moriyo rahem...

KE:In Thy presence Lord!
KE:And Virgin Mary
KE:Carried Thee who dost carry
KE:Mountains and depths in Thy hand
KE:She conceived Thee sans marriage
KE:And gave birth amazingly,
KE:Magnify her memory, Lord! Barekmor​.
