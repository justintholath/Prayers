h1:Psalms 51
AE:Have mercy on me O God, according to your unfailing love, according to your great compassion, blot out my transgressions.
AM:Daivame ninte krupayin prakaaram ennodu karuna cheyaname./ Ninte karunayude behuthwathin prakaram / ente papangal mayichu kalayename.

AE:Wash away all my iniquity, and cleanse me from my sin. For I acknowledge my transgression, and my sin is always before me.​
AM:Ente annyayathil ninnu enne nannayi kazhuki, / ente papangalil ninnum enne vedippakkename; / Enthennaal ente athikramangal ellam njan ariyunnu, / ente papangal eppozhum ente nereyum irikkunnu.

AE:Against you, you only have I sinned, and done what is evil in your sight, so that you are proved right when you speak, and justified when you judge. Surely I was sinful at birth, sinful from the time my mother conceived me.​
AM:Ninnodu thanne njaan papam chaithu,/ ninte thirumunpil thinmakal njaan chaithu./ Ennaal ninte vachanathil nee neethikarikka pedukayum, / ninte nyayavidhikalil nee jayikkukayam cheyvaanum aayittu thanne. / Enthennal anyayathil njan ulbhavichu;/ Papangalil ente mathavu enne garbham dharikkukayum cheythu.

AE:Surely you desire truth in the inner parts; you teach me wisdom in the inmost place. Cleanse me with hyssop, and I will be clean, wash me, and I will be whiter than snow.
AM:Ennaal neethiyil nee ishtapettu,/ ninte Njaanathinte rehasyangal enne nee ariyichu, / ninte soppa kondu ente mel thalikkename,/ njaan vedippakkapedum, athinaale enne venmayakkename; / uracha manjinekkaal njaan venmayakum.

AE:Let me hear joy and gladness; let the bones you have crushed rejoice. Hide your face from my sins, and blot out, all my iniquity.
AM:Ninte aanandavum santhoshavum kondu enne thrupthi aakkenanme,/ ksheenam ulla ente asthikal santhoshikkum./ Ente papangalil ninnu ninte thiru mukham thirichu / ente athikramangal okkeyum mayikkaname.

AE:Create in me a pure heart O God, and renew a steadfast spirit within me. Do not cast me away from thy presence, or take away your Holy Spirit from me.​
AM:Daivame! vedippulla hrudayam ennil srushtikkename!/ Sthiratha ulla ninte roohaye ente ullil puthuthakkename. / Ninte thiru munpil ninnu enne thalli kalayaruthe; / Ninte visudha aathmavine ennil ninnu edukkayum aruthe.​

AE:Restore to me the joy of your salvation, and uphold me by your generous spirit. Then I will teach transgressors your ways, and sinners will turn back to you.
AM:Ennaalo ninte aanandavum rekshayum enikku thirichu tharename./ Mahathwam ulla ninte aathmavu enne thangumar aakename. / Appol njan athikramakkaare ninte vazhi patippikum, / paapikal ninkalekku thiriyukayum cheyum.

AE:Save me from bloodguilt, O God, the God who saves me, and my tongue will sing your righteousness. O Lord, open my lips, and my mouth will declare your praise.
AM:Ente rekshayude Daivam aaya Daivame! Rekthathil ninnu enne rekshikkename! Ente naavu ninte neethiye sthuthikkum. Karthaave! ente adharangal eniku thurakkename. / Ente vai ninte sthuthikal paadum.

AE:You do not delight in sacrifices, or I would bring it, and you do not take pleasure in burnt offerings. The sacrifices of God are a broken spirit, a broken and contrite heart, O God, you will not despise.
AM:Enthennal balikalil nee thirumanassu aayilla./ Homa balikalil nee nirappu aayathum illa./ Daivathinte balikal thazhma  ulla athmavu aakunnu, / Daivam nurungiya hrudayam nirasikunnilla.

AE:In your good pleasure, make Zion prosper, build up the walls of Jerusalem. Then there will be righteous sacrifices, whole burnt offerings to delight you, then bulls will be offered on your altar.​
AM:Ninte ishtathhaal sehiyonodu nanma cheyyename./ Oorshleminte mathilukal paniyename./ Appol neethi balikalilum, homa balikalilum nee ishtapedum./ Appol ninte belipeetathin mel kaalakal bali aayi karerum.

AE:And to you belongs the praise, O God. Barekmor. †Shubaho...  Men olam... ​
AM:Daivame sthuthi ninakku yogyam aakunnu. Barekmor​. †Shubaho...  Men olam... ​

h1:Psalms 140, 141, 118, 116
AE:Barekmor, O Lord, I call to You, come quickly to me. Hear my voice when I call to You.
AM:Barekmor, Karthaave! njaan ninne vilichu; / Ennodu nee utharam arulicheythu / ente vachanangal shradhhichu kelkkaname.

AE:May my prayer be set before You like incense; may the lifting up of my hands be like the evening sacrifice. Set a guard over my mouth, O Lord; keep watch over the door of my lips.
AM:Ente praarthana thirumunpake dhoopam poleyum, / ente kaikalile kazcha / vaikunnerathe kazcha poleyum kaikollename. / Ente hrudayam dushkaryathinu chayukayum, njaan annyaya kriyakal pravarthikkukayum cheyyathe irippan, / ente vaaikku kavalkkaraneyum / ente adharangalkku sookshippu-karaneyum niyamikkename.

AE:Let me not sit at the table of the wicked. Let the righteous man teach me, let him reprove me, but the oil of the wicked shall not anoint my head, my prayer is against their evil deeds. When their judges are thrown down in stony places, they shall hear my words, for they are sweet.
AM:Dushta manushyarodu kude njaan / appam bhakshikumaar aakaruthe. / Neethimaan enne patippikkukayum shaasikkukayum cheyyatte./ Dushtanmarude enna ente thalaye kozhuppikkaruthe. / Enthennaal ente praarthana avarude dosham nimitham aakunnu./ Avarude nyayaadhi-pathimaar paarayaal thadayapettu./ Imbam ulla ente vachanangal avar kettu.

AE:They will say, “As one plows and breaks up the earth, so our bones have been scattered at the mouth of the grave. ”But my eyes are fixed on You, O Sovereign Lord; in You I take refuge – do not give me over to death.
AM:Bhoomiye kozhu pilarnnu chitharikunna athupole,/ pathaala vaathukal avarude asthikal chitharikkapettu./ Karthave! ente kannukal ninkaleku njaan uyarthi, ninnil sharanapettu. / Ente aathmaavine thallikalayaruthe.

AE:Keep me from the snares they have laid for me, from the traps set by evildoers. Let the wicked fall into their own nets, while I pass by in safety.
AM:Enikkai kenikal marachu vachittulla / prashamsakkarude kayyil ninnum enne kaathu kollename./ Njaan kadannu pokumpol annyaayakkaar orumichu / thangalude valakalil veezhumar aakename.

AE:I cry aloud to the Lord; I lift up my voice to the Lord for mercy I pour out my complaint before Him; before Him I tell my trouble. When my spirit grows faint within me, it is You who know my way.
AM:Ente shabdathhil karthavine njaan vilichu./ Ente shabdathhil Karthavinodu njaan apekshichu./ Thirusannidhiyil ente sankatamnjaan uyarthukayum,/ thirumunpil ente njerukkam njaan ariyikkukayum cheythu./ Ente aathmavu kuntitha-pettu irikkumbol / ente ooduvazhikal nee ariyunnu.

AE:In the path where I walk, men have hidden a snare for me. Look to my right and see; no one is concerned for me. I have no refuge; no one cares for my life. I cry to You, O Lord; I say, “You are my refuge, my portion in the land of the living.”
AM:Ente nadappukalude vazhiyil / avar enikkai kenikal marachu vechu./ Njaan valathottu nokki;/ Enne ariyunnavan illennu njaan kandu,/ Sanketha sthalam enikku illathe aayi./ Enikku vendi apekshi-kkunnavanum illa./ Karthave ! Njaan ninnodu nilavilichu./ Nee ente aashrayavum,/ jeevan ullavarude deshathu / ente ohariyum aakunnu ennu njaan paranju.

AE:Listen to my cry, for I am in desperate need; rescue me from those who pursue me, for they are too strong me. Set me free from my prison, that I may praise Your name.Then the righteous will gather about me because of Your goodness to me.
AM:Ente apeksha shradhhichu kelkename./ Enthennaal njaan ettam thazthapettu irikunnu./ Enne peetippikkunnavaril ninnu enne viduvikkename./ Enthennal avar ennekkal belamullavar aayi theernu./ Njaan ninte naamathe sthuthi-kkendathinu/ ente aathmaavine kaaraagrehathil ninnu viduvikkename./ Nee enikku vendi pakaram cheyyumpol / ninte neethimaanmar enikkai kathirikkum.

AE:Your word is a lamp to my feet and a light to my path I have taken an oath and confirmed it, that I will follow your righteous laws. I have suffered much; preserve my life, O Lord, according to Your word. Accept, O Lord, the willing praise of my mouth, and teach me yourlaws.
AM:Ninte vachanam ente kalukalkku vilakkum,/ ente ooduvazhikalkku prakaashavum aakunnu./ Ninte neethi ulla vidhikal pramaanikkunnathinnai njaan aanayittu nischayichu./ Njaan ettam ksheenichu irikunnu./ Karthaave ninte vachana-prakaram enne jeevippikkename./ Karthaave ente vaayile vachanangalil nee ishtapettu,/ ninte pramaanangal enne patippikkename.

AE:Though I constantly take my life in my hands, I will not forget your law. The wicked have set a snare for me, but I have not strayed from your precepts. Your statues are my heritage forever; they are the joy of my heart. My heart is set on keeping your decrees to the very end
AM:Ente aathmavu ellayippozhum ninte kaikalil irikkunnu./ Ninte nyaaya-pramanam njaan marannu illa,/ Dushtanmaar enikkayi kenikal vachu./ Ennaalum njaan ninte kalpanakalil ninnum thetti-poyilla./ Njaan ninte saakshi ennekkum aayi avakasha-peduthi./ Enthennaal athu ente hrudaya-thhinte aanandam aakunnu./ Ninte kalpanakal ennekkum sathya-thode cheyvaan aayittu/ njaan ente hrudayam thirichu.

AE:Praise the Lord, all you nations; extol Him, all you peoples For great is His love toward us, and the faithfulness of the Lord endures forever. Praise the Lord.
AM:Sakala jaathikalume! Karthaavine sthuthipin,/ sakala janangalume! avane sthuthipin./ Enthennaal avante krupa nammude mel balapettu irikunnu;/ avan sathyam aayittu ennekum karthavu aakunnu.

AM:Daivame sthuthi ninakku yogyam aakunnu. Barekmor​. †Shubaho...  Men olam... ​
