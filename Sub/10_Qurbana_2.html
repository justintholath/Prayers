h2:Thubden II (for the living faithful Brethren)​
AE:Deacon:- Barekmor./ Again we call to remembrance, O Lord,/ all our brethren, the faithful and true Christians,/ who have bidden us and earnestly requested us,/ humble and feeble though we be,/ to remember them on this occasion and at this time./ We pray Thee, Lord God Almighty,/ on behalf of all those who are fallen in all kinds of hard trials/ and taken refuge in Thee,/ that they may soon be delivered and visited by Thee;/ and on behalf of this congregation preserved by God,/ and for the unity​ and prosperity of all her faithful members,/ that they may continue in virtue:/ Let us beseech the Lord.​
AM:Deacon:- (Barekmor) Sarva shakthi ulla dhaivam aaya karthaave! / Pala vidham aaya kadina pareekshakalil akappettu ninnil aashrayichu irikkunnavarude rakshakku vendiyum, / vegathil nee avare darshikkunnathinu vendiyum, / ee naazhikayilum ee samayathum njangal orkkuvaan aayittu / nissaararum balaheenarum aaya njangalodu munkootti kalpichu njangale thaalparyappeduthiyittu ulla / vishwaasikalum sathya kristhyaanikalum aayaa njangalude sahodarangale​ ellaavareyum njangal orkkunnu. / Dhaivathaal paalikkappettu irikkunna ee vishudha sabhayude makkal aakunna vishwaasikal aaya ellaavarkkum, / anyonyam aikyavum abhivridhiyum undakuvaan aayittum, avar sukrutham ullavar aayi theeruvaan ayittum / karthaavinodu naam praarthikkanam.​

h2:Thubden IV (for the mother of God and the Saints)​
AE:Deacon:- Barekmor./ Again we commemorate her,/ who is worthy of being called blessed,/ and extolled of all the generations of the earth,/ holy, glorious and blessed, / ever virgin and blissful,/ Mary the Mother of God./ Along with her let us remember also the Prophets and the Apostles;/ the Preachers and the Evangelists;/ the Martyrs and the Confessors;/ the blessed St. John the Baptist, the forerunner of his master;/ and the illustrious Saint Stephen, chief of the Deacons, and the first of the​ martyrs;/ and the exalted St. Peter and St. Paul, chief among the Apostles/ and our father St. Thomas./ Let us remember at the same time, the whole company of the saints,/ both men and women./ May their prayers be a refuge to us./ Let us beseech the Lord.​

h2:Thubden V (for the departed spiritual Fathers and Doctors of the Church)
AE:Deacon:- Barekmor./ Again we remember those,/ who have before us fallen asleep in holiness/ and taken repose in the abode of the saints,/ and who maintained and delivered and entrusted to us / the one apostolic and uncorrupt faith./ We also acknowledge those three synods,/ sacred, holy and ecumenical;/ namely that in Nicea, / that in Constantinople, and that in Ephesus;/ and our illustrious and divine holy Fathers and Doctors, who participated in them;/ the venerable St. James, the first​ Archbishop of Jerusalem, apostle and martyr;/ and Ignasius, Clement, Dionysius, Athanasius, / Julius, Baselius, Gregorius, Dioscorus, / Timothius, Philoxenos, Antimus, and Ivanius;/ and mentionable especially by name, / St. Cyril, that exalted and veritable tower of knowledge,/ who expounded the doctrine of the incarnation of God the Word,/ our Lord Jesus Christ,/ declaring and showing clearly that He became incarnate./ We remember also our Patriarch St. Severus, / the crown of the Syrians, the eloquent mouth,/ the pillar and the doctor of the Holy Church of God as a whole;/ the meadow abounding in​ blossom,/ who preached all the time that Mary was undoubtedly the God - bearer;/ and our venerable and holy Father Mor Jacob Baradaeus,/ the upholder of the Orthodox faith;/ and Mor Ephrem and Mor Jacob and Mor Isaac and Mor Baleus / and Mor Bar Soumas, the chief among mourners;/ and Mor Simeon the Stylite,/ and Mor Abahai the elect one;/ and Yeldo Mar Baselius our father/ and saints of Malankara Mar Gregorius, Mar Dionysius;/ and those before them, and with them, and after them,/ who have kept and handed down and entrusted to us / the one genuine and undefiled faith./ May their prayers be a ​stronghold to us./ Let us beseech the Lord.​
