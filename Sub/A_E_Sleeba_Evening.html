† I will enter your house in reverence / and offer my vows to you.
h3:While entering the chancel, the deacon shall say
I come into the sanctuary of God / even to the God / who gives joy to my childness
h3:The deacon shall proceed to the altar and bow before it, saying
I have entered your house O God / and before your throne I have worshipped, O heavenly King | Forgive me all the sins that I have committed against you.
h3:Going round the altar and kissing its corners he says
O Lord / bind our assemblies with chains / even to the corners of your sanctuary | You are my God / I will give thanks to you | You are my God, I will glorify you.
h3:Shushroosha kuppaayam dharikkumpol
O Lord God / clothe with an incorruptible surplice / by the power of the Holy Spirit | O Father, son and Holy spirit / grant us that / by pure and upright lives / we be guided in true faith / all the days of our lives / now and always, for ever - Amen.

h2:Kauma

† Crucified for us, Have mercy on us.

Glory be to Thee, O Creator, ​
Glory be to The Messiah, King who has compassion on us thy sinful servants, Barekmor.

Our Father who art in heaven, - hallowed be thy name, - Thy kingdom come, - Thy will be done on earth, - as it is in heaven. - Give us this day our daily bread, - and forgive us our debts and sins, - as we also have forgiven our debtors. - Lead us not into temptation, - but deliver us from the evil one. - For Thine is the kingdom, the power and the glory, - forever and ever, Amen.​

Peace to thee Mary, full of grace, - our Lord is with thee. Blessed are thou among women, - and blessed is the fruit of thy womb, - our Lord Jesus Christ. O, Virgin Saint Mary, - O Mother of God, - pray for us sinners, - now at all times, - and at the hour of our death, Amen.​

h3:Psalms 140
Barekmor, O Lord, I call to You, come quickly to me. Hear my voice when I call to You.

May my prayer be set before You like incense; may the lifting up of my hands be like the evening sacrifice. Set a guard over my mouth, O Lord; keep watch over the door of my lips.

Let me not sit at the table of the wicked. Let the righteous man teach me, let him reprove me, but the oil of the wicked shall not anoint my head, my prayer is against their evil deeds. When their judges are thrown down in stony places, they shall hear my words, for they are sweet.

They will say, “As one plows and breaks up the earth, so our bones have been scattered at the mouth of the grave.”But my eyes are fixed on You, O Sovereign Lord; in You I take refuge – do not give me over to death.

Keep me from the snares they have laid for me, from the traps set by evildoers. Let the wicked fall into their own nets, while I pass by in safety.
h3:Psalm 141
I cry aloud to the Lord; I lift up my voice to the Lord for mercy I pour out my complaint before Him; before Him I tell my trouble. When my spirit grows faint within me, it is You who know my way.

In the path where I walk, men have hidden a snare for me. Look to my right and see; no one is concerned for me. I have no refuge; no one cares for my life. I cry to You, O Lord; I say, “You are my refuge, my portion in the land of the living.”
