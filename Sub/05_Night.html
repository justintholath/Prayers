h3:Beginning Prayer - Common
AE:O Lord, who is wakeful and do not sleep, awaken us from our sleep in the sloth of sin that we may praise Your wakefulness. O Living and eternal One who does not die, wake us up from the sleep in death and destruction that we may worship Your compassion. Father, Son and holy Spirit, who are being praised and adored on earth and in heaven, make us worthy to praise You and adore You in holiness, along with the glorious company of heavenly angels now and always and for ever. Amen.​
AM:Urakkam illatha unarvu ullavan aaya ente karthaave! ninte unarchaye sthothram cheyyuvan aayittu paapa muzhukalil ninnu njangalude urakkathe unarthename. Maranam illatha jeevan ullavane! ninte karunaye njangal vandhippaan aayittu, maranathinteyum, naashathinteyum urakkathil ninnu njangalude maranathe jeevippikkename. Pithavum puthranum parishudhha roohayume! swargathhilum bhoomiyilum sthuthikkappettavanum vaazhthappettavanum nee aakayal ninne sthuthikkunnavar aaya swargeeya maalaakamaarude mahathwam ulla vrindhangalodu orumichu vishudhhiyodu koodi ippozhum eppozhum ennekkum ninne sthuthichu vaazhthuvaan njangale yogyar aakkename. Amen.

h3:Praise of the angels
AE:Like the heavenly angels who praise You up in the heights, we who are frail and sinful offer praise.
AM:Athyunnathangalil swargeeya maalaakamaar sthuthikkunnathu pole, balaheenarum manmayarum aaya njangalum sthuthichu parayunnu.
AA:
AE:Glory to God in the highest heaven, and peace on earth, tranquility and good will among men at all times and in all seasons.
AM:Kaalam okkeyilum, neram okkayilum, uyarangalil dhaivathinu sthuthiyum, bhoomiyil samaadhaanavum nirappum, manushya makkalkku nalla sahranavum, (undayirikkatte)
AA:
AE:We praise You, we bless You, we adore You. We sing to You a hymn of praise.
AM:Njangal ninne sthuthikkukayum, vaazhthukayum, vandhikkukayum cheyyunnu. Sthuthiyude shabdam ninakku njangal karettunnu.
AA:
AE:We give thanks to You because of Your great glory, Lord, our creator, king of heaven, God the Father almighty; we praise You, Jesus Christ, Lord God, God's only Son, along with the Holy Spirit.
AM:Sarva shakthi ulla pithaavum, swargeeya rajavum srushhtaavum aakunna dhaivam aaya karthavum, yeshu mashiha aakunna eka puthran aaya dhaivam aaya karthaavum, parishudhha ruhaayum aakunna ninne ninte sthuthiyude valippam nimitham njangal sthothram cheyyunnu.
AA:
AE:Lord God, Lamb of God and word of the Father, who takes away the sin of the world, be gracious to all.
AM:Pithavinte puthranum, vachanavum, lokathhinte paapathe vahikkunnavanum vahichavanum aaya dhaivathinte kunjadu aaya karthaave! njangalodu karuna cheyyename.
AA:
AE:You, who take away the sin of the world, incline your ear to us and receive our prayers.
AM:Lokathhinte paapathe vahikkunnavanum, vahichavanum aayullove! ninte chevi chaayichu njangalude apeksha kaikkollename.
AA:
AE:You, who sit in glory at the right hand of Your Father, have compassion on us and be gracious to all.
AM:Pithaavinte valathu bhaagathu mahathwathode irikkunnavane! dhaya thonni njangalodu karuna cheyyename.
AA:
AE:Because You only are holy. Lord Jesus Christ, You deserve the great glory of God, the Father along with the Holy Spirit. Amen.
AM:Enthennaal nee mathram parishudhan aakunnu. Pithaavaam dhaivathinte mahathwathinu, vishudhha roohayodu koode yeshu mashiha! nee mathram karthavu aakunnu.
AA:
AE:At all times and on all the days of our lives we bless You and praise Your holy and eternal name.
AM:Ella kaalathum njangal jeevanode irikkunna divasangal okkeyum ninne njangal vaazhthukayum, ennekkum vazhthappettathum, nithyatha ullathum aaya ninte parishudhha thiru naamathe sthuthikkukayum cheyyum.
AA:
AE:Blessed are You, Lord, Upholder of all, God of our fathers, Your name is blessed and glorified with praises, for ever and ever.
AM:Njangalude pithaakkanmarude dhaivam aaya sarvashakakthi ulla karthaave! nee vaazhthappettavan aakunnu. Ninte thirunaamam sthuthikkappettathum ennekkum sthuthikalal prabalappettathum aakunnu.
AA:
AE:To you belongs glory, to you belongs praise, to you belongs honor, God of all, Father of truth; we praise You, Your only Son and the living holy Spirit, now and always and for ever and ever. Amen.
AM:Sthuthi ninakku yogyam aakunnu. Mahathwam ninakku yuktham aakunnu. Sakalathinteyum dhaivavum, sathyathinte pithavum aayavane! ninakkum, eka puthranum, jeevan ulla vishudhha roohaykkum, ippozhum, ella samayathum ennekkum pukazhcha chercha aakunnu. Amen.

AE:Lord Jesus Christ, do not close the door of Your mercy on our faces. Lord, we confess that we are sinners, have mercy upon us.
AM:Moron eshu mishiha! ninte karunayude vaathil njangalude mukhangalil nee adaykaruthe. Karthaave! njangal paapikal aakunnu ennu njangal ettu parayunnu. Njangalodu karuna undakename.
AM:
